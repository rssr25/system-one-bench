name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: offline smoke run (mock model)
        run: |
          sys1bench generate support_tickets /tmp/t.jsonl --n 50 --seed 1
          sys1bench run /tmp/t.jsonl /tmp/p.jsonl --adapter mock --framings support_tickets --permutations 2 --cache /tmp/c.sqlite
          sys1bench score /tmp/p.jsonl --out /tmp/summary.json
      - name: build sdist and wheel
        run: pip install build && python -m build && pip install dist/*.whl --force-reinstall --no-deps && sys1bench --version
