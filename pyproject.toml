[project]
name = "sys1bench"
version = "0.2.0"
description = "Benchmark harness for typed System One decision models (choice / score / noul)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "pydantic>=2.5",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
local = ["torch>=2.4", "transformers>=4.45", "sentence-transformers>=3.0"]
llm = ["vllm>=0.6", "outlines>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sys1bench = "sys1bench.cli:app"

# Third-party model adapters register here so future models plug in without touching this repo.
[project.entry-points."sys1bench.adapters"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E731", "E741", "E501"]
