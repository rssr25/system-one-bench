<svg xmlns="http://www.w3.org/2000/svg" width="560" height="140" viewBox="0 0 560 140" role="img" aria-label="sys1bench">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- mark: three typed answers (choice bar, score ladder, noul dial) inside a rounded tile -->
  <rect x="10" y="10" width="120" height="120" rx="24" fill="url(#g)"/>
  <!-- choice: probability bars -->
  <rect x="30" y="34" width="14" height="60" rx="3" fill="#fff" opacity="0.35"/>
  <rect x="30" y="58" width="14" height="36" rx="3" fill="#fff"/>
  <rect x="50" y="34" width="14" height="60" rx="3" fill="#fff" opacity="0.35"/>
  <rect x="50" y="42" width="14" height="52" rx="3" fill="#fff"/>
  <rect x="70" y="34" width="14" height="60" rx="3" fill="#fff" opacity="0.35"/>
  <rect x="70" y="78" width="14" height="16" rx="3" fill="#fff"/>
  <!-- score ladder -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="98" y1="40" x2="112" y2="40"/>
    <line x1="98" y1="54" x2="112" y2="54"/>
    <line x1="98" y1="68" x2="112" y2="68"/>
    <line x1="98" y1="82" x2="112" y2="82"/>
  </g>
  <circle cx="105" cy="54" r="5" fill="#FBBF24"/>
  <!-- noul dial -->
  <path d="M34 108 A36 36 0 0 1 106 108" fill="none" stroke="#fff" stroke-width="4" opacity="0.5"/>
  <path d="M34 108 A36 36 0 0 1 88 78" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  <!-- wordmark -->
  <text x="150" y="78" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#111827">sys<tspan fill="#4F46E5">1</tspan>bench</text>
  <text x="152" y="108" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#6B7280" letter-spacing="0.5">a benchmark for typed System One decision models</text>
</svg>
